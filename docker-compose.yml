services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_report_studio_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_report_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_report_studio_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai_report_studio_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/ai_report_studio
      - JWT_SECRET=ai-report-studio-vip-pro-super-secret-key-32chars-min!
      - ENVIRONMENT=production
    ports:
      - "8050:8050"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai_report_studio_web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8050/api/v1
    ports:
      - "3050:3050"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
